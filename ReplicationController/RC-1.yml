apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-pod
  labels:
    app: rc
  namespace: dev-ns
spec:
  replicas: 3
  selector:
    app: rc
  template:
    metadata:
      labels:
        app: rc
    spec:
      containers:
        - name: obito
          image: shaikmustafa/cycle
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rc-svc
  namespacc: dev-ns
spec:
  type: LoadBalancer
  selector:
    app: rc
  ports:
    - port: 80
      targetPort: 80 