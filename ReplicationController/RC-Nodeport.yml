apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-nodeport
  namespace: dev-ns
  labels:
   app: nodeports
spec:
  replicas: 3
  selector:
    app: nodeports
  template:
    metadata:
      labels:
        app: nodeports
    spec:
      containers:
        - name: obito12
          image: shaikmustafa/cycle
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  namespace: dev-ns
spec:
  type: NodePort
  selector:
    app: nodeports
  ports:
   - port: 80
     targetPort: 80
