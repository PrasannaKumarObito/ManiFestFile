apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-clusterip
  namespace: dev-ns
  labels:
    app: cluster
spec:
  replicas: 3
  selctor:
    app: cluster
  template:
    metadata:
      labels:
        app: cluster
    spec:
      containers:
        - name: obito-11
          image: shaikmustafa/dm
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-clusterip
  namespace: dev-ns
spec:
  type: ClusterIP
  selector:
    app: cluster
  ports:
   - port: 80
     targetPort: 80
     