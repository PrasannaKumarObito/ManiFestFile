apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-dep
  namespace: dev-ns
  annotations:
    kubernetes.io/change-cause: "Deployment with DM application"
spec:
  selector:
    replicas: 4
    matchLabels:
      app: blue-green
      version: blue
  template:
    metadata:
      labels:
        app: blue-green
        version: blue
    spec:
      containers:
      - name: obito
        image: shaikmustafa/dm
        ports:
        - containerPort: 80
