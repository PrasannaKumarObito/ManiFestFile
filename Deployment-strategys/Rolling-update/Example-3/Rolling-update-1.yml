apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-update-dep
  namespace: dev-ns
  annotations:
    kubernetes.io/change-cause: "Deployment with DM application"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  revisionHistoryLimit: 8
  minReadySeconds: 5
  selector:
    matchLabels:
      app: rolling-update
  template:
    metadata:
      labels:
        app: rolling-update
    spec:
      containers:
        - name: obito
          image: shaikmustafa/dm
          ports:
            - containerPort: 80
