apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-rolling
  namespace: dev-ns
  labels:
    app: rolling-update
spec:
  replicas: 3
  startegys:
    type: RollingUpdate
    rollingUpdate:
      maxSurgy: 1
      maxUnavailable: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  selector:
        app: rolling-update
  template:
    metadata:
      labels:
        app: rolling-update
    spec:
      containers:
        - name: obito
          image: shaikmustafa/dm
          ports:
            - containerPort: 80

