apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-deployment-pod
  namespace: dev-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deployment-1
      version: v1
  template:
    metadata:
      labels:
        app: deployment-1
        version: v1
    spec:
      containers:
        - name: obito-1
          image: shaikmustafa/cycle
          ports:
            - containerPort: 80
            