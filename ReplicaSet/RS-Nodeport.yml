apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-ns-pod
  namespace: dev-ns
  labels:
    app: rs-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rs-ns
  template:
    metadata:
      labels:
        app: rs-ns
    spec:
      containers:
        - name: obito13
          image: shaikmustafa/cycle
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rs-svc-np
  namespace: dev-ns
spec:
  type: NodePort
  selector:
    app: rs-ns
  ports:
    - port: 80
      targetPort: 80