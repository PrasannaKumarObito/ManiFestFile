apiVersion: v1
kind: Pod
metadata:
  name: cluster-ip-pod
  namespace: dev-ns
  labels:
    app: cluster-service
spec:
  containers:
    - name: obito-2
      image: shaikmustafa/dm
      ports:
       - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-ip-pod-service
  namespace: dev-ns
spec:
  type: ClusterIP
  selector:
    app: cluster-service
  ports:
   - port: 80
     targetPort: 80
