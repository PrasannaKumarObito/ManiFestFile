apiVersion: v1
kind: Pod
metadata:
  name: lb-pod
  namespace: dev-ns
  labels:
    app: lb
spec:
  containers:
    - name: obito-4
      image: shaikmustafa/dm
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lb-service
  namespace: dev-ns
  annotaion: 
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: lb
  ports:
    - port: 80
      targetPort: 80