apiVersion: v1
kind: Pod
metadata:
  name: nodeport-pod
  namespace: dev-ns
  labels:
    app: nodeport
spec:
  containers:
    - name: obito-3
      image: shaikmustafa/dm
      ports:
       - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport-pod-service
  namespace: dev-ns
spec:
  type: NodePort
  selector:
    app: nodeport
  ports:
   - port: 80
     targetPort: 80
     nodePort: 30001
  
