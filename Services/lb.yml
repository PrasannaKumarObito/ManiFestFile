apiVersion: v1
kind: Pod
metadata:
  name: obito-lb
  labels:
    app: obito
spec:
  containers:
    - name: obito-prasanna
      image: shaikmustafa/cycle
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: obito-service
spec:
  type: LoadBalancer
  selector:
    app: obito
  ports:
  - port: 80
    targetPort: 80
